<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BharatLex Explorer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#000c}
#bar b{color:#f0a040;margin-right:6px}input,select,button{background:#1a1a1a;color:#ddd;border:1px solid #444;border-radius:6px;padding:6px 8px;font-size:13px}
button{cursor:pointer}label{font-size:12px;white-space:nowrap}
#panel{position:fixed;right:0;top:48px;bottom:0;width:min(420px,92vw);background:#0d0d0df2;border-left:1px solid #333;padding:12px;overflow:auto;display:none;z-index:4;font-size:14px;line-height:1.5}
#panel h3{margin:0 0 6px;color:#f0a040}#panel .hi{color:#9fd0ff;margin-top:10px;white-space:pre-wrap}#panel .en{white-space:pre-wrap}
#panel a{color:#7fb0ff;cursor:pointer;display:block;margin:2px 0}#legend{position:fixed;left:10px;bottom:10px;background:#000a;padding:8px 10px;border-radius:8px;font-size:12px;z-index:3}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#msg{position:fixed;left:10px;bottom:90px;font-size:12px;color:#aaa;z-index:3}
</style><script src="https://unpkg.com/three-spritetext"></script><script src="https://unpkg.com/3d-force-graph"></script></head><body>
<div id="bar"><b>BharatLex Explorer</b>
<input id="q" placeholder="Search e.g. BNS 103, murder, bail" list="dl"><datalist id="dl"></datalist>
<select id="actf"><option value="">All acts</option><option>BNS</option><option>BNSS</option><option>BSA</option></select>
<label><input type="checkbox" id="k_refers_to" checked> references</label>
<label><input type="checkbox" id="k_similar" checked> similar</label>
<label><input type="checkbox" id="k_theme" checked> themes</label>
<input id="from" size="9" placeholder="path from"><input id="to" size="9" placeholder="to"><button id="go">Find path</button>
<button id="reset">Reset</button></div>
<div id="g"></div><div id="panel"></div><div id="msg"></div>
<div id="legend"><div><span class="dot" style="background:#f0a040"></span>Act</div>
<div><span class="dot" style="background:#4488ee"></span>Theme</div>
<div><span class="dot" style="background:#e5534b"></span>BNS section</div>
<div><span class="dot" style="background:#3fb97c"></span>BNSS section</div>
<div><span class="dot" style="background:#c9c9c9"></span>BSA section</div></div>
<script>
const COL={act:"#f0a040",theme:"#4488ee"},SEC={BNS:"#e5534b",BNSS:"#3fb97c",BSA:"#c9c9c9"};
const LC={in_act:"#555",theme:"#2f5fa8",refers_to:"#f0a040",similar:"#888"};
let data,G,byId={},nb={},pathSet=new Set(),pathLinks=new Set();
const $=id=>document.getElementById(id);
const lid=e=>typeof e==="object"?e.id:e;
fetch("graph.json").then(r=>r.json()).then(d=>{
 data=d;d.nodes.forEach(n=>{byId[n.id]=n;nb[n.id]=[]});
 d.links.forEach(l=>{nb[l.source].push([l.target,l.kind]);nb[l.target].push([l.source,l.kind])});
 $("dl").innerHTML=d.nodes.map(n=>`<option value="${n.label}">`).join("");
 G=ForceGraph3D()($("g")).graphData(d).backgroundColor("#0a0a0a")
  .nodeColor(n=>pathSet.has(n.id)?"#ffffff":(n.type==="section"?SEC[n.act]:COL[n.type]))
  .nodeVal(n=>n.type==="act"?160:n.type==="theme"?30:n.val).nodeLabel(n=>n.label).nodeOpacity(.9)
  .nodeThreeObjectExtend(true)
  .nodeThreeObject(n=>{if(n.type==="section")return null;
    const t=new SpriteText(n.type==="act"?n.id:n.label);t.color=n.type==="act"?"#ffd9a0":"#9cc4ff";
    t.textHeight=n.type==="act"?14:7;t.position.y=n.type==="act"?16:9;return t})
  .linkColor(l=>pathLinks.has(l)?"#fff":LC[l.kind]).linkOpacity(.35)
  .linkWidth(l=>pathLinks.has(l)?3:0).linkVisibility(visible)
  .onNodeClick(show);
 G.d3Force("charge").strength(n=>n.type==="section"?-45:-200);
 G.d3Force("link").distance(l=>l.kind==="in_act"?110:l.kind==="theme"?90:45);
 G.onEngineStop(()=>{if(!window._fit){window._fit=1;G.zoomToFit(900,60)}});
});
function visible(l){
 if(l.kind!=="in_act"&&!$("k_"+l.kind).checked)return false;
 const f=$("actf").value;if(!f)return true;
 for(const n of [byId[lid(l.source)],byId[lid(l.target)]]){
  if(n.type==="section"&&n.act!==f)return false;
  if(n.type==="act"&&n.id!==f)return false}
 return true}
function refresh(){G.linkVisibility(visible)}
["k_refers_to","k_similar","k_theme","actf"].forEach(i=>$(i).onchange=refresh);
const norm=x=>x.toLowerCase().replace(/[§\s:]+/g,"");
function find(s){const k=norm(s);if(!k)return null;
 return data.nodes.find(n=>norm(n.label)===k)||data.nodes.find(n=>norm(n.label).includes(k))}
function show(n){
 G.cameraPosition({x:n.x*1.3+20,y:n.y*1.3+20,z:n.z*1.3+60},n,900);
 let h=`<h3>${n.label}</h3>`;
 if(n.type==="section")h+=`<div class="en">${n.en}</div><div class="hi">${n.hi}</div>`;
 const rel={};(nb[n.id]||[]).forEach(([id,k])=>{if(k!=="in_act")(rel[k]=rel[k]||[]).push(id)});
 const names={refers_to:"Connected by reference",similar:"Similar sections",theme:"Themes / sections"};
 for(const k in rel){h+=`<p><b>${names[k]}</b> (${rel[k].length})</p>`+rel[k].slice(0,60).map(id=>`<a onclick="show(byId['${id}'])">${byId[id].label}</a>`).join("")}
 $("panel").innerHTML=h;$("panel").style.display="block"}
$("q").onchange=()=>{const n=find($("q").value);if(n)show(n);else $("msg").textContent="Not found"};
$("go").onclick=()=>{const a=find($("from").value),b=find($("to").value);
 if(!a||!b){$("msg").textContent="Enter two valid nodes, e.g. BNS §103 and BNSS §100";return}
 const prev={[a.id]:null},q=[a.id];
 while(q.length){const c=q.shift();if(c===b.id)break;
  for(const[x]of nb[c]){if(byId[x].type!=="act"&&!(x in prev)){prev[x]=c;q.push(x)}}}
 if(!(b.id in prev)){$("msg").textContent="No path";return}
 const p=[];for(let c=b.id;c!==null;c=prev[c])p.unshift(c);
 pathSet=new Set(p);pathLinks=new Set(data.links.filter(l=>{
  const s=lid(l.source),t=lid(l.target);const i=p.indexOf(s),j=p.indexOf(t);return i>=0&&j>=0&&Math.abs(i-j)===1}));
 G.nodeColor(G.nodeColor()).linkColor(G.linkColor()).linkWidth(G.linkWidth());
 $("msg").textContent="Path: "+p.map(x=>byId[x].label).join(" → ")};
$("reset").onclick=()=>{pathSet=new Set();pathLinks=new Set();$("panel").style.display="none";$("msg").textContent="";
 G.nodeColor(G.nodeColor()).linkColor(G.linkColor()).linkWidth(G.linkWidth());G.zoomToFit(800)};
</script></body></html>
